[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Serial execution — never run tests in parallel ──────────────────
# pytest-xdist is disabled to prevent multiple WSL worker processes
# that crash the system under memory pressure.
addopts = -p no:xdist

# ── Timeout: kill any single test that hangs beyond 120 s ───────────
# Prevents a stuck Ollama/DB call from hanging the whole suite.
# Requires: pip install pytest-timeout  (already in requirements.txt)
timeout = 120
